title: SSH Brute Force Attempt
id: 11111111-1111-4111-8111-111111111101
status: active
description: >
  Multiple failed SSH authentication attempts originating from a single source
  IP within a short window, indicating a brute-force or credential-stuffing attack.
severity: high
tags:
  - authentication
  - brute-force
  - ssh
mitre:
  - tactic: Credential Access
    technique: T1110
    technique_name: Brute Force
logsource:
  product: linux
  category: authentication
detection:
  condition: threshold
  event:
    event.action: ssh_failed_login
    event.outcome: failure
  group_by: source.ip
  threshold: 5
  timeframe: 60s
